name: sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'starry/xml/**'
      - '.github/workflows/sync.yaml'
  schedule:
    - cron: '0 20 * * 0'

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 test APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          fetch-depth: 0

      - name: 拉取本仓库 starry/xml
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: _fork
          sparse-checkout: starry/xml

      - name: 覆盖夜间启动资源
        shell: bash
        run: |
          set -e
          root="_fork/starry/xml"
          dst="android/app/src/main/res"
          find "$root" -type f | while IFS= read -r f; do
            rel="${f#$root/}"
            mkdir -p "$dst/$(dirname "$rel")"
            cp -v "$f" "$dst/$rel"
          done

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub

      - name: 上传测试包
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-arm64-test-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
