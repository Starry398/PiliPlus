name: sync

on:
  schedule:
    # 每周一 08:00 北京时间（UTC 周一 00:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 tag（留空 = 取上游最新正式版）'
        required: false
        default: ''
      test_only:
        description: '只出测试包（发布到 tag=test 的公开 release，不碰正式版本）'
        required: false
        type: boolean
        default: false
      force:
        description: '忽略「已有同名 release」，强制重建并覆盖 asset'
        required: false
        type: boolean
        default: false
      pkg_suffix:
        description: '包名后缀，如 .test 会装成 com.example.piliplus.sky.test（可与正式包共存）'
        required: false
        default: ''

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  PKG_NAME: com.example.piliplus.sky${{ github.event.inputs.pkg_suffix }}

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      out_tag: ${{ steps.r.outputs.out_tag }}
      do_build: ${{ steps.r.outputs.do_build }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.upstream_tag }}
          INPUT_TEST: ${{ github.event.inputs.test_only }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -e
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/bggRGjQaUbCoE/PiliPlus/releases/latest --jq .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::无法获取上游 tag"
            exit 1
          fi
          echo "上游 tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$INPUT_TEST" = "true" ]; then
            echo "模式: 测试包（发布到 tag=test）"
            echo "out_tag=test" >> "$GITHUB_OUTPUT"
            echo "do_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "out_tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$INPUT_FORCE" = "true" ]; then
            echo "do_build=true" >> "$GITHUB_OUTPUT"
            echo "模式: 强制重建（忽略已有 release）"
            exit 0
          fi

          if gh api "repos/Starry398/PiliPlus/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "本仓库已有 $TAG 的 release，跳过（需要重发请勾 force）"
            echo "do_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build arm64-v8a
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: 拉取本仓库 starry/xml
        uses: actions/checkout@v4
        with:
          repository: Starry398/PiliPlus
          ref: main
          path: _fork
          sparse-checkout: starry/xml

      - name: 覆盖启动图资源
        shell: bash
        run: |
          set -e
          root="_fork/starry/xml"
          dst="android/app/src/main/res"
          find "$root" -type f | while IFS= read -r f; do
            rel="${f#$root/}"
            mkdir -p "$dst/$(dirname "$rel")"
            cp -v "$f" "$dst/$rel"
          done

      - name: 安装 ImageMagick
        shell: bash
        run: |
          set -e
          if command -v convert >/dev/null 2>&1; then
            echo "已预装：$(convert -version | head -1)"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick
          convert -version | head -1

      - name: 夜间 splash 白底转透明
        shell: bash
        run: |
          set -e
          mapfile -t files < <(find android/app/src/main/res -type f -path '*drawable-night*/splash.png')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没找到 drawable-night*/splash.png"
            exit 1
          fi
          for f in "${files[@]}"; do
            size=$(identify -format '%wx%h' "$f")
            convert "$f" -fuzz 10% -transparent white "$f"
            echo "处理 $f (${size}) → 透明像素均值 $(convert "$f" -format '%[fx:mean.a]' info:)"
          done

      - name: 改包名
        shell: bash
        run: |
          set -e
          f=android/app/build.gradle.kts
          sed -i "s|applicationId = \"com.example.piliplus\"|applicationId = \"$PKG_NAME\"|" "$f"
          if ! grep -q "applicationId = \"$PKG_NAME\"" "$f"; then
            echo "::error::applicationId 替换失败"
            grep -n 'applicationId' "$f"
            exit 1
          fi
          echo "包名:"; grep -n 'applicationId = ' "$f"

      - name: 写入签名
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 KEYSTORE"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > android/key.properties
          echo "签名配置已写入"

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build arm64-v8a APK
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -e
          NAME="${TAG#v}"
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag 不是 x.y.z 格式: $NAME"
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "::error::minor/patch 超过 99，编码方案需调整: $NAME"
            exit 1
          fi
          # 版本基数 major*10000 + minor*100 + patch，再 ×1000 给「构建序号」留位，
          # 保证同一版本号每次重建的 versionCode 都不同（否则同 versionCode+同签名
          # 会被安装器当成「已是最新」而静默跳过覆盖安装）。
          BASE=$((MAJOR*10000 + MINOR*100 + PATCH))
          SEQ=$((GITHUB_RUN_NUMBER % 1000))
          NUM=$((BASE*1000 + SEQ))
          echo "versionName=$NAME versionCode=$NUM (base=$BASE seq=$SEQ)"
          # --split-per-abi 才会把插件的 prebuilt so 按 ABI 拆开；
          # 只用 --target-platform 的话，libmpv 等 so 会同时带 arm64 和 v7a，体积多约 13MB
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-name "$NAME" \
            --build-number "$NUM" \
            --dart-define-from-file=pili_release.json \
            --no-pub
          ls -lh build/app/outputs/flutter-apk/

      - name: 校验签名与包名
        shell: bash
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::找不到 $APK"
            ls -l build/app/outputs/flutter-apk/
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK 仍是 debug 签名，检查 secrets"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -E "^package:" | tee /tmp/badging.txt
          if ! grep -q "name='$PKG_NAME'" /tmp/badging.txt; then
            echo "::error::包名不是 $PKG_NAME"
            exit 1
          fi
          grep -o "versionCode='[0-9]*'" /tmp/badging.txt | head -1

      - name: 重命名
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::找不到 $APK"
            ls -l build/app/outputs/flutter-apk/
            exit 1
          fi
          SUFFIX="${{ github.event.inputs.pkg_suffix }}"
          SUFFIX="${SUFFIX#.}"
          if [ -n "$SUFFIX" ]; then
            OUT="out/PiliPlus_${TAG}_arm64-v8a_${SUFFIX}.apk"
          else
            OUT="out/PiliPlus_${TAG}_arm64-v8a.apk"
          fi
          mkdir -p out
          cp "$APK" "$OUT"
          ls -lh out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/PiliPlus_*_arm64-v8a*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 清理旧 asset 与旧 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_TAG: ${{ needs.resolve.outputs.out_tag }}
        run: |
          set +e
          if [ "$OUT_TAG" = "test" ]; then
            rid=$(gh api "repos/${{ github.repository }}/releases/tags/test" --jq .id 2>/dev/null)
            if [ -n "$rid" ]; then
              echo "删除旧 test release id=$rid"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$rid"
            fi
          else
            ids=$(gh api "repos/${{ github.repository }}/releases/tags/$OUT_TAG" \
              --jq '.assets[] | select(.name | endswith("_arm64.apk")) | .id')
            for id in $ids; do
              echo "删除旧 asset id=$id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done
          fi
          echo done

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.out_tag }}
          name: ${{ needs.resolve.outputs.out_tag == 'test' && 'test build' || needs.resolve.outputs.out_tag }}
          body: ${{ needs.resolve.outputs.out_tag == 'test' && format('测试包 / 上游 {0} / run {1}', needs.resolve.outputs.tag, github.run_number) || '' }}
          files: PiliPlus_*_arm64-v8a*.apk
          generate_release_notes: ${{ needs.resolve.outputs.out_tag != 'test' }}
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
