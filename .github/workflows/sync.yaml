name: sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 tag（留空 = 取上游最新正式版）'
        required: false
        default: ''
      test_only:
        description: '只出测试包，不发 release'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      do_build: ${{ steps.r.outputs.do_build }}
      do_release: ${{ steps.r.outputs.do_release }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.upstream_tag }}
          INPUT_TEST: ${{ github.event.inputs.test_only }}
        run: |
          set -e
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/bggRGjQaUbCoE/PiliPlus/releases/latest --jq .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::无法获取上游 tag"
            exit 1
          fi
          echo "上游 tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$INPUT_TEST" = "true" ]; then
            echo "do_build=true" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "模式: 测试包（不发版）"
            exit 0
          fi

          if gh api "repos/Starry398/PiliPlus/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "本仓库已有 $TAG 的 release，跳过"
            echo "do_build=false" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "do_build=true" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build arm64
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: 拉取本仓库 starry/xml
        uses: actions/checkout@v4
        with:
          repository: Starry398/PiliPlus
          ref: main
          path: _fork
          sparse-checkout: starry/xml

      - name: 覆盖启动图资源
        shell: bash
        run: |
          set -e
          root="_fork/starry/xml"
          dst="android/app/src/main/res"
          find "$root" -type f | while IFS= read -r f; do
            rel="${f#$root/}"
            mkdir -p "$dst/$(dirname "$rel")"
            cp -v "$f" "$dst/$rel"
          done

      - name: 写入签名
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 KEYSTORE"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > android/key.properties
          echo "签名配置已写入"

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build arm64 APK
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -e
          NAME="${TAG#v}"
          NUM=$(git rev-list --count HEAD)
          echo "versionName=$NAME versionCode=$NUM"
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$NAME" \
            --build-number "$NUM" \
            --dart-define-from-file=pili_release.json \
            --no-pub

      - name: 校验签名
        shell: bash
        run: |
          set -e
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK 仍是 debug 签名，检查 secrets"
            exit 1
          fi

      - name: 重命名
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -e
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)
          mkdir -p out
          cp "$APK" "out/PiliPlus_${TAG}_arm64.apk"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/PiliPlus_*_arm64.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          files: PiliPlus_*_arm64.apk
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
